<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 · 这一页不在清单里</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <!-- 样式内联：这个页面要在 GitHub Pages / Vercel / Express 三种环境下都能独立显示 -->
    <style>
      :root {
        --paper: #f4f1ea;
        --surface: #fffdf9;
        --ink: #1a1917;
        --ink-2: #55504a;
        --ink-3: #8c8578;
        --line: #e4ded1;
        --accent: #23695b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(900px 380px at 50% -160px, #fff 0%, rgba(255, 255, 255, 0) 70%),
          var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        line-height: 1.6;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 28px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 1px 2px rgba(26, 25, 23, 0.05), 0 18px 40px -24px rgba(26, 25, 23, 0.35);
        text-align: center;
      }
      .code {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      h1 { font-size: 17px; margin: 14px 0 6px; }
      p { margin: 0; font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
      .hint {
        margin-top: 18px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #f6f3ec;
        font-size: 12.5px;
        color: var(--ink-3);
        text-align: left;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
        padding: 1px 5px;
        border-radius: 5px;
        background: #ebe6da;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 42px;
        margin-top: 20px;
        padding: 0 20px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      a.btn:hover { background: #1b5449; }
      footer { margin-top: 18px; font-size: 11.5px; color: var(--ink-3); }
    </style>
  </head>

  <body>
    <main class="card">
      <p class="code">404</p>
      <h1>这个页面不在清单里</h1>
      <p>你要找的地址不存在。<br />可能是链接打错了，或者这一页已经被删除。</p>

      <p class="hint">
        顺带一提：这是<strong>服务端</strong>返回的 404 —— 响应头里 <code>Status: 404</code>，
        不是前端画出来的假 404。打开 F12 → Network 能直接看到。
      </p>

      <a class="btn" href="./">回到清单</a>
      <footer>一句话清单 · 26级第五阶段</footer>
    </main>
  </body>
</html>
